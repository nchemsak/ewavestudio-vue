<html lang="en">

<head>
	<meta charset="UTF-8" />
	<link rel="icon" type="image/png" href="/ephemeral-wave-128.png" sizes="128x128" />
	<!-- Installing as an app (PWA): the manifest, and the icon for an iPhone's home screen. The
		 service worker is build-plugins/serviceWorker.js, registered by src/composables/usePwa.ts -->

	<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description"
		content="Ephemeral Wave is a browser-based drum synth and step sequencer for creating evolving electronic rhythms." />
	<meta name="theme-color" content="#050713" />
	<meta name="color-scheme" content="dark synthwave" />
	<title>Ephemeral Wave Synth 2</title>
	<!-- The Google Analytics tag is added by the build only: build-plugins/googleAnalytics.js -->
</head>

	<div id="app"></div>
	<script type="module" src="/src/main.ts"></script>
</body>
